name: Deploy to PROD (ECS Fargate)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:      us-east-1
#  ENVIRONMENT:     prod
#  ECR_PRODUCT:     shopms-prod-product-service
  ECR_ORDER:       shopms-prod-order-service
#  ECR_FRONTEND:    shopms-prod-frontend
#  ECS_CLUSTER:     shopms-prod-cluster
#  PRODUCT_SVC:     shopms-prod-product-service
#  ORDER_SVC:       shopms-prod-order-service
#  FRONTEND_SVC:    shopms-prod-frontend

jobs:
  build-order:
    name: Build Order Service
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push Order Service
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$REGISTRY/$ECR_ORDER:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          docker tag $IMAGE_URI $REGISTRY/$ECR_ORDER:latest
          docker push $REGISTRY/$ECR_ORDER:latest
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT