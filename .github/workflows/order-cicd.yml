name: CI/CD — Order Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_IMAGE: rohitkumar4praja/order-service

jobs:
  test-and-validate:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: build and test application
        run: mvn clean test

  build-and-deploy:
    name: Build Docker & Update GitOps
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: rohits324/sales-k8s
          token: ${{ secrets.GITOPS_TOKEN }}
          path: sales-k8s

      - name: Update Deployment Image Tag
        run: |
          sed -i "s|image: ${{ env.DOCKERHUB_IMAGE }}:.*|image: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}|g" sales-k8s/orderservice/order-deployment.yml

      - name: Commit & Push Changes
        run: |
          cd sales-k8s
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add orderservice/order-deployment.yml
          git commit -m "ci(order-service): update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main