# ============================================
# Order Service — PRODUCTION Profile
# Values injected via ECS Task Definition environment variables
# ============================================
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.h2.console.enabled=false

# Internal ALB DNS — injected via ECS environment variable
# e.g. http://internal-shop-alb-123456.us-east-1.elb.amazonaws.com
product.service.url=${PRODUCT_SERVICE_URL}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

logging.level.com.example=INFO
logging.level.org.springframework=WARN
